<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Solstice | Minecraft Shader &amp; Texture Pack Studio</title>
<meta name="description" content="Free browser studio for Minecraft Java Edition: 15 curated shader packs, live WebGL2 shader builder with 81 options, and a resolution-aware texture pack maker with image-to-pixel-art conversion.">
<meta name="theme-color" content="#050c1f">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23050c1f'/%3E%3Ccircle cx='32' cy='32' r='16' fill='%23ffffff'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/core.css">
<link rel="stylesheet" href="css/studio.css">
</head>
<body>
<header>
  <div class="brand-title">
    <span class="logo-mark" aria-hidden="true">S</span>
    <h1>Solstice</h1>
  </div>
  <span class="hdr-sep" aria-hidden="true"></span>
  <nav class="top-nav" aria-label="Workspace">
    <button data-tab="packs" class="on">Shader Packs</button>
    <button data-tab="build">Shader Builder</button>
    <button data-tab="tex">Texture Studio</button>
    <button data-tab="tools">Minecraft Tools</button>
  </nav>
  <span class="sp"></span>
  <button class="pri" id="hdr-action" title="Quick download / export for the active tab">Open Builder</button>
</header>

<main>
  <section class="tab on" id="tab-packs"></section>
  <section class="tab" id="tab-build"></section>
  <section class="tab" id="tab-tex"><p class="note">Loading Texture Studio...</p></section>
  <section class="tab" id="tab-tools"><p class="note">Loading Minecraft Tools...</p></section>
</main>

<footer id="status-bar" aria-label="Studio status">
  <span class="sb-pill" id="sb-mode">Shader Packs</span>
  <span id="sb-info">15 Minecraft Java shader packs (Iris &amp; OptiFine)</span>
  <span class="sp"></span>
  <span>Solstice Studio</span>
</footer>

<div class="toast" id="toast"></div>

<script src="js/sol-data.js"></script>
<script src="js/sol-engine.js"></script>
<script src="js/preview-gl.js"></script>
<script src="js/tex-catalog.js"></script>
<script src="js/tex-studio.js"></script>
<script src="js/mc-tools.js"></script>
<script src="js/app.js"></script>
</body>
</html>
